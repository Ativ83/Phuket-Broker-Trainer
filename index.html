const scenarios=[["Первый контакт","Здравствуйте! Вы оставляли заявку по недвижимости на Пхукете. Меня зовут [имя], я брокер. Уточню цель покупки и бюджет, затем предложу подходящие объекты. Рассматриваете недвижимость для жизни, отдыха или инвестиций?","Какой бюджет закладываете на покупку с учётом оформления и когда планируете сделку?","Зафиксировать цель, бюджет и срок. Предложить три подходящих объекта и назначить конкретное время их разбора."],["Выявление цели","Чтобы сравнить объекты по подходящим критериям, расскажите, какого результата вы ждёте от покупки.","Как часто планируете приезжать? Рассматриваете сдачу в аренду?","Зафиксировать главную цель и критерии"],["Бюджет и расходы","Давайте определим комфортный бюджет с учётом не только цены, но и оформления и содержания.","В какой валюте удобнее сравнивать? Есть ли резерв на дополнительные расходы?","Согласовать диапазон полной стоимости"],["Банг Тао или Раваи","Эти районы отличаются инфраструктурой и образом жизни. Сравним их под вашу задачу, а не по общему рейтингу.","Что важнее: пляж, школы, кафе, спокойствие или аренда?","Предложить сравнительную подборку"],["Инвестиционный покупатель","Для инвестиции важно считать не рекламную доходность, а денежный поток после расходов и простоев.","Какой срок владения? Насколько важна ликвидность?","Подготовить несколько сценариев расчёта"],["Покупка для семьи","Для семейной покупки начнём с повседневной логистики, школ, медицины и удобства района.","Сколько человек будет жить? Нужна ли школа?","Составить список районов и объектов"],["Возражение: дорого","Понимаю. Давайте сравним не только стоимость квадратного метра, но и характеристики и полные расходы.","С какими объектами сравниваете? Что для вас принципиально?","Показать альтернативы и компромиссы"],["Опасение: застройщик","Проверка застройщика и документов — разумный этап до принятия решения.","Какие риски волнуют больше всего: сроки, качество или документы?","Согласовать независимую юридическую проверку"],["Обещают 12% доходности","Высокие проценты требуют проверки методики расчёта, расходов и условий договора.","Это прогноз или договорное обязательство? Учтены простои и налоги?","Запросить подтверждающие документы"],["Форма владения","Для иностранного покупателя форма владения зависит от типа недвижимости и условий проекта.","Рассматриваете кондоминиум или виллу?","Направить условия независимому юристу"],["Отправьте в WhatsApp","Конечно, отправлю. Чтобы не перегружать вариантами, уточню один критерий.","Что важнее: район, бюджет или назначение покупки?","Согласовать подборку и срок обратной связи"],["Назначение презентации","Предлагаю коротко сравнить 2–3 подходящих варианта с плюсами, ограничениями и расходами.","Удобнее видеозвонок или письменная подборка?","Назначить конкретный следующий контакт"]] .concat(PhuketV2.extra);const app=document.querySelector('#app');let persona='investor',turns=[],facts={},rec=null;let buyer=PhuketV2.create(persona),grades=[],branchState=PhuketBranches.create(),branchMode="training",examState=null,dealState=null;try{const saved=JSON.parse(localStorage.getItem('phuket-branch-v5')||'null');if(saved&&PhuketBranches.get(saved.node)&&PhuketBranches.roots.some(r=>r.id===saved.root)&&Array.isArray(saved.history)&&saved.history.length<=100){branchState=saved}}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tab(t){stop();for(const k of ['scripts','dialog','branches','deal','daily','exam','stats','calc','notes','knowledge','smm'])document.getElementById('tab-'+k).classList.toggle('active',k===t);if(t==='knowledge')PhuketKnowledgeUI.renderList(app);if(t==='smm')PhuketSMMUI.renderList(app);if(t==='scripts')list();if(t==='dialog')dialog();if(t==='notes')notes();if(t==='branches')branches();if(t==='deal')deal();if(t==='daily')daily();if(t==='exam')exam();if(t==='stats')stats();if(t==='calc')calc()}
function list(query=''){app.innerHTML='<h2>Сценарии Пхукета</h2><p class="muted">40 консультационных скриптов. Поиск по теме и тексту.</p><input id="scriptsearch" type="search" placeholder="Поиск: скидка, юрист, Банг Тао…" aria-label="Поиск сценариев" value="'+esc(query)+'" style="width:100%;padding:13px;background:#161d29;color:white;border:1px solid #5b606a;border-radius:12px">'+scenarios.map((s,i)=>'<article data-script="'+i+'"><div class="category">Сценарий '+(i+1)+'</div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p><button data-i="'+i+'">Открыть</button></article>').join('');app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>detail(+b.dataset.i));const search=document.getElementById('scriptsearch');search.oninput=()=>{const q=search.value.toLocaleLowerCase('ru').replace(/ё/g,'е');app.querySelectorAll('[data-script]').forEach(el=>{const s=scenarios[+el.dataset.script];el.hidden=!s.join(' ').toLocaleLowerCase('ru').replace(/ё/g,'е').includes(q)})};search.dispatchEvent(new Event('input'))}
function detail(i){const s=scenarios[i];app.innerHTML='<button id="back">← Все сценарии</button><article><div class="category">Сценарий '+(i+1)+'</div><h2>'+esc(s[0])+'</h2><h3>Рекомендуемая формулировка</h3><div class="bubble">'+esc(s[1])+'</div><button id="listen">Прослушать</button><h3>Уточняющий вопрос</h3><div class="bubble">'+esc(s[2])+'</div><h3>Следующий шаг</h3><p>'+esc(s[3])+'</p><button id="practice" class="primary">Отработать с клиентом</button></article>';document.getElementById('back').onclick=list;document.getElementById('listen').onclick=()=>speak(s[1]);document.getElementById('practice').onclick=()=>{turns=[];facts={};buyer=PhuketV2.create(persona);tab('dialog')}}
const topics=[['goal',/для чего|цель|инвестиц|сдава|прожива|отдых/,'Скорее для инвестиций, но иногда будем приезжать сами.'],['budget',/бюджет|сумм|ценов|сколько.*(готов|рассчитыва)/,'Рассматриваю примерно 10–12 миллионов рублей, но хочу понимать все расходы.'],['area',/район|локац|пляж|инфраструктур|банг тао|раваи/,'Пока выбираю между Банг Тао и Раваи. В чём разница для инвестора?'],['term',/срок|когда.*(покуп|решен)|как скоро/,'Могу принять решение в ближайшие месяцы, если найду понятный вариант.'],['risk',/риск|опасен|беспоко|смуща|сомнен|довер/,'Беспокоят документы и слишком оптимистичные обещания доходности.']];
const objections=[[/доходност|процент|гарант/,'Как рассчитана доходность? Учтены налоги, управление и простои?'],[/дешев|скидк|цен/,'А какие дополнительные расходы есть помимо цены объекта?'],[/застройщ|документ|юрист/,'Можно ли до оплаты провести независимую проверку документов?'],[/срочно|последн.*(квартир|вариант)/,'Не хочу принимать решение под давлением. Лучше сначала сравним условия.']];
const fallbacks={investor:['Можете привести конкретные цифры и их источники?','А какие риски вы видите у этого объекта?','Что ещё можно сравнить в моём бюджете?','Каким будет следующий шаг для проверки предложения?'],family:['Насколько удобно там жить с семьёй?','А что с инфраструктурой и транспортом?','Какие минусы у этого варианта?','Можно посмотреть альтернативы?']};
function reply(t){const response=PhuketV2.respond(buyer,t);facts=buyer.facts;return response}
const opening=()=>PhuketV2.templates[persona].opening;const last=()=>turns.at(-1)?.client||opening();
function draw(announce){const box=document.getElementById('chat');if(!box)return;box.innerHTML='<div class="bubble client"><b class="speaker-label">КЛИЕНТ · ВОПРОС / ОТВЕТ</b><p>'+esc(opening())+'</p></div>'+turns.map(t=>'<div class="bubble me"><b class="speaker-label">БРОКЕР · ВАШ ОТВЕТ</b><p>'+esc(t.broker)+'</p></div><div class="bubble client"><b>Клиент</b><p>'+esc(t.client)+'</p></div>').join('');box.scrollTop=box.scrollHeight;if(announce&&document.getElementById('auto').checked)speak(last())}
function dialog(){app.innerHTML='<h2>Голосовой диалог · бесплатно</h2><p class="dialog-notice">Клиент отвечает по правилам, а не с помощью нейросети. Вопросы распознаются по ключевым словам; ответы могут повторяться.</p><div class="panel"><label>Характер покупателя<select id="persona"><option value="investor">Требовательный инвестор</option><option value="family">Осторожный семейный покупатель</option><option value="skeptic">Недоверчивый покупатель</option></select></label><div class="actions"><button id="restart">Новый звонок</button><button id="report">Разбор</button></div><div id="chat" class="chat"></div><div class="panel coach-panel"><div class="category">Помощник брокера</div><p id="hintbody" class="hint-text">Попробуйте ответить самостоятельно или откройте подсказку.</p><div class="actions"><button id="hint">Подсказка</button><button id="model">Пример ответа</button></div></div><textarea id="input" maxlength="3000" placeholder="Напишите или продиктуйте ответ брокера"></textarea><div class="actions"><button id="mic">Говорить</button><button id="send" class="primary">Ответить</button><button id="repeat">Озвучить клиента</button></div><label class="small"><input type="checkbox" id="auto" checked> Автоматически озвучивать ответы</label><p id="status" class="dialog-status" role="status"></p><div id="reportbody"></div></div>';document.getElementById('persona').value=persona;document.getElementById('persona').onchange=e=>{persona=e.target.value;turns=[];facts={};buyer=PhuketV2.create(persona);grades=[];draw(true)};document.getElementById('restart').onclick=()=>{turns=[];facts={};buyer=PhuketV2.create(persona);grades=[];draw(true)};document.getElementById('report').onclick=report;document.getElementById('send').onclick=send;document.getElementById('repeat').onclick=()=>speak(last());document.getElementById('mic').onclick=listen;document.getElementById('hint').onclick=()=>showHint(1);document.getElementById('model').onclick=()=>showHint(2);draw(false)}
function showHint(level){const g=PhuketCoach.guidance(buyer);document.getElementById("hintbody").textContent=level===1?g.hint:g.phrase;}
function send(){const input=document.getElementById('input'),text=input.value.trim();if(!text){document.getElementById('status').textContent='Сначала введите ответ.';return}const grade=PhuketCoach.evaluate(text,buyer);grades.push(grade);const client=reply(text);turns.push({broker:text,client});input.value='';document.getElementById('status').textContent='Оценка: '+grade.score+'/100. '+grade.feedback.join(' ');document.getElementById('hintbody').textContent='Новый вопрос — попробуйте ответить самостоятельно или откройте подсказку.';draw(true)}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('status').textContent='Распознавание недоступно. Используйте диктовку клавиатуры iPhone.';return}stop();try{const r=new R();rec=r;r.lang='ru-RU';r.continuous=false;r.interimResults=false;r.onresult=e=>{if(rec!==r)return;document.getElementById('input').value=Array.from(e.results).map(x=>x[0].transcript).join(' ');document.getElementById('status').textContent='Речь распознана. Проверьте текст и нажмите «Ответить».'};r.onerror=e=>document.getElementById('status').textContent='Ошибка распознавания: '+e.error;r.onend=()=>{if(rec===r)rec=null};r.start();document.getElementById('status').textContent='Слушаю…'}catch(e){document.getElementById('status').textContent='Микрофон недоступен: '+e.message}}
function report(){const names={goal:'Цель',budget:'Бюджет',area:'Район',term:'Сроки',risk:'Опасения'};document.getElementById('reportbody').innerHTML='<article><h3>Разбор</h3><p>Реплик брокера: '+turns.length+'. Затронуто тем: '+Object.keys(facts).length+' из 5.</p><p>Средняя оценка: '+(grades.length?Math.round(grades.reduce((sum,g)=>sum+g.score,0)/grades.length):'—')+'/100.</p><p>'+esc(grades.at(-1)?.feedback.join(' ')||'Проведите диалог для разбора.')+'</p><p>'+esc(Object.keys(facts).map(k=>names[k]).join(', ')||'Пока нет')+'</p><p class="small">Оценка приблизительная: учитывает вопросы, темы, полноту ответа и признаки давления.</p></article>'}

function saveBranch(){try{localStorage.setItem('phuket-branch-v5',JSON.stringify(branchState))}catch{}}
function branches(){
 const s=branchState,n=PhuketBranches.view(s),p=PhuketBranches.progress(s);
 app.innerHTML='<h2>Разветвлённые переговоры</h2><p class="small" style="font-size:1.2em;line-height:1.6">Тренировка — ответы без подсказок. Бот — лучший вариант выделен зелёным. Клиент запоминает ход беседы и может реагировать иначе при повторном прохождении.</p><div class="actions" role="group" aria-label="Режим ветвлений"><button id="branch-training" class="'+(branchMode==='training'?'active':'')+'" aria-pressed="'+(branchMode==='training')+'">Тренировка</button><button id="branch-bot" class="'+(branchMode==='bot'?'active':'')+'" aria-pressed="'+(branchMode==='bot')+'">Бот · подсказки</button></div>'+
 '<label>Сложность<select id="branchdifficulty"><option value="normal">Обычный клиент</option><option value="hard">Требовательный клиент</option></select></label><label>Ситуация<select id="branchroot">'+PhuketBranches.roots.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title)+'</option>').join('')+'</select></label>'+
 '<div class="panel"><div class="category">Ход переговоров</div><p>Шагов: '+p.turns+' · Баллы: '+p.score+' · Доверие: '+p.trust+'/100 · Изучено узлов: '+p.unique+' · Тем в памяти: '+p.topics+'</p><div role="progressbar" aria-label="Доверие клиента" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p.trust+'" style="height:12px;border-radius:9px;background:#343b49;overflow:hidden"><div style="height:100%;width:'+p.trust+'%;background:'+(p.trust<35?'#df8c82':'#65d8a2')+'"></div></div><div class="bubble client"><b>Клиент</b><p>'+esc(n.client)+'</p></div>'+
 (n.choices.length?'<p><b>Выберите ответ брокера:</b></p>'+n.choices.map((o,i)=>'<button class="branch-choice'+(branchMode==='bot'&&PhuketBranches.best(s.node).includes(i)?' branch-best':'')+'" data-choice="'+i+'" style="display:block;width:100%;text-align:left;margin:8px 0">'+(branchMode==='bot'&&PhuketBranches.best(s.node).includes(i)?'<span class="bot-marker" aria-label="Подсказка тренажёра">✓ РЕКОМЕНДУЕМЫЙ ОТВЕТ</span>':'')+'<span class="broker-speech">'+esc(o[1])+'</span>'+'</button>').join(''):'<article><h3>Разговор завершён</h3><p>'+ (s.node==='end_good'?'Клиент согласился на следующий шаг.':s.node==='end_bad'?'Клиент отказался от общения.':'Контакт завершён корректно.')+'</p></article>')+
 (branchMode==='bot'&&n.choices.length?'<div class="panel"><b>Совет бота:</b> '+esc(PhuketBranches.advice(s.node,PhuketBranches.best(s.node)[0]))+'</div>':'')+
 (p.complete?'<article><h3>Итог переговоров</h3><p>'+esc(PhuketBranches.summary(s).outcome)+'</p><p>Удачных решений: '+PhuketBranches.summary(s).positives+' · Ошибок: '+PhuketBranches.summary(s).mistakes+'</p><p>'+esc(PhuketBranches.summary(s).tip)+'</p><h3>Разбор ошибок</h3>'+ (PhuketBranches.review(s).errors.length?PhuketBranches.review(s).errors.map((e,i)=>'<div class="review-error"><b>Ошибка '+(i+1)+'</b><p><b>Ваш ответ:</b> '+esc(e.your)+'</p><p><b>Лучше ответить:</b> '+esc(e.better)+'</p><p>'+esc(e.why)+'</p></div>').join(''):'<p>Серьёзных ошибок не обнаружено.</p>')+'<p><b>Рекомендуемая тема:</b> '+esc(PhuketBranches.review(s).focus)+'</p></article>':'')+
 '<div class="panel" style="border-left:5px solid #8edaff"><b>Что помнит клиент</b><p>'+ (PhuketBranches.memoryOf(s).topics.length?'Обсуждали: '+esc(PhuketBranches.memoryOf(s).topics.map(x=>({goal:'цель покупки',budget:'бюджет',area:'районы',term:'сроки',risk:'риски',legal:'документы',costs:'расходы',returns:'доходность',family:'потребности семьи',selection:'подбор объектов'}[x]||'другие вопросы')).join(', ')):'Пока вы не обсудили детали.')+'</p></div>'+ 
 '<div class="actions"><button id="branchrestart">↻ Начать заново</button><button id="branchhistory">История решений</button><button id="branchmap">Карта веток</button></div><div id="branchinfo"></div></div>';
 document.getElementById('branch-training').onclick=()=>{branchMode='training';branches()};document.getElementById('branch-bot').onclick=()=>{branchMode='bot';branches()};
 document.getElementById('branchdifficulty').value=s.difficulty||'normal';document.getElementById('branchdifficulty').onchange=e=>{branchState=PhuketBranches.create(s.root,e.target.value);saveBranch();branches()};
 document.getElementById('branchroot').value=s.root;
 document.getElementById('branchroot').onchange=e=>{branchState=PhuketBranches.create(e.target.value,s.difficulty);saveBranch();branches()};
 document.getElementById('branchrestart').onclick=()=>{branchState=PhuketBranches.create(s.root,s.difficulty,(s.variant||0)+1);saveBranch();branches();const info=document.getElementById('branchinfo');info.innerHTML='<p role="status" style="color:#65d8a2;font-weight:700">Новая тренировка началась. Счёт и доверие сброшены. Выберите первый ответ.</p>';document.getElementById('branchroot').scrollIntoView({behavior:'smooth',block:'start'})};
 app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{PhuketBranches.step(branchState,Number(b.dataset.choice));saveBranch();if(PhuketBranches.progress(branchState).complete)recordTraining(branchState);branches()});
 document.getElementById('branchhistory').onclick=()=>{document.getElementById('branchinfo').innerHTML='<h3>Ваш маршрут</h3>'+(s.history.length?s.history.map((h,i)=>'<p>'+(i+1)+'. '+esc(h.label)+' · '+(h.delta>0?'+':'')+h.delta+' балла · доверие '+h.trust+'/100<br>'+esc(PhuketBranches.advice(h.from,h.choice))+'</p>').join(''):'<p>Пока нет решений.</p>')};
 document.getElementById('branchmap').onclick=()=>{const seen=new Set();let queue=[s.root],rows=[];while(queue.length){const id=queue.shift();if(seen.has(id))continue;seen.add(id);const node=PhuketBranches.get(id);if(!node)continue;rows.push('<details><summary>'+esc(id)+' · '+node.choices.length+' вариантов</summary>'+node.choices.map(o=>'<p>'+esc(o[0])+' → '+esc(o[2])+'</p>').join('')+'</details>');queue.push(...node.choices.map(o=>o[2]))}document.getElementById('branchinfo').innerHTML='<h3>Карта вариантов ('+seen.size+' узлов)</h3>'+rows.join('')};
}


const dealStages=[
 {title:'Знакомство',client:'Я впервые рассматриваю Пхукет. Не знаю, подойдёт ли мне покупка.',answers:['Для чего рассматриваете недвижимость и кто будет ею пользоваться?','Сразу вносите депозит, иначе цена вырастет.','Все покупают, и вам надо.'],correct:0,why:'Сначала выясните цель покупки.'},
 {title:'Выявление потребностей',client:'Хочу жить зимой и иногда сдавать квартиру.',answers:['Давайте уточним сроки проживания, аренду, бюджет и желаемый район.','Тогда вам подойдёт абсолютно любой объект.','Не важно, какой бюджет.'],correct:0,why:'Нужно собрать критерии до подбора.'},
 {title:'Подбор объекта',client:'Мне предлагают две квартиры. Как выбрать?',answers:['Сравним расходы, расположение, юридические документы и вашу цель.','Выбирайте самую дорогую.','По фотографиям всё понятно.'],correct:0,why:'Подбор строится на критериях клиента.'},
 {title:'Возражение по цене',client:'Ваш вариант дороже предложения конкурента.',answers:['Давайте сравним условия, комплектацию и полную стоимость.','У конкурента точно мошенники.','Тогда разговор окончен.'],correct:0,why:'Сравнивайте проверяемые параметры без нападок.'},
 {title:'Проверка рисков',client:'А если застройщик задержит передачу квартиры?',answers:['Проверим договор, график, ответственность и независимую юридическую экспертизу.','Такого никогда не бывает.','Лучше не думать о рисках.'],correct:0,why:'Риски нужно назвать и проверить.'},
 {title:'Следующий шаг',client:'В целом интересно. Что дальше?',answers:['Подготовлю подборку и документы; выберем конкретное время обсудить их вместе?','Сначала отправьте депозит мне лично.','Я гарантирую прибыль и перепродажу.'],correct:0,why:'Фиксируйте прозрачный следующий шаг.'}
];
function deal(){
 if(!dealState)dealState={index:0,score:0,trust:50,history:[]};
 const d=dealState,stage=dealStages[d.index];
 if(!stage){const won=d.trust>=60&&d.score>=12;app.innerHTML='<h2>Экзамен на сделку завершён</h2><article><h3>'+(won?'Клиент готов к следующему шагу':'Клиент не готов продолжать')+'</h3><p>Баллы: '+d.score+' · Доверие: '+d.trust+'/100</p><h3>Разбор ответов</h3>'+d.history.map((h,i)=>'<div class="'+(h.ok?'review-good':'review-error')+'"><b>'+esc(dealStages[i].title)+'</b><p>'+esc(h.why)+'</p>'+(h.ok?'':'<p><b>Лучший ответ:</b> '+esc(dealStages[i].answers[0])+'</p>')+'</div>').join('')+'<button id="deal-restart">Новая сделка</button></article>';document.getElementById('deal-restart').onclick=()=>{dealState=null;deal()};return}
 const order=[1,2,0].map((x,i)=>(x+d.index)%3);
 app.innerHTML='<h2>Экзамен на полную сделку</h2><p class="muted">Шесть этапов: от знакомства до следующего шага. Ошибки снижают доверие.</p><div class="panel"><div class="category">Этап '+(d.index+1)+' из '+dealStages.length+' · '+esc(stage.title)+'</div><p>Доверие клиента: '+d.trust+'/100</p><div class="bubble client"><b>Клиент</b><p>'+esc(stage.client)+'</p></div>'+order.map(i=>'<button class="deal-choice" data-deal="'+i+'">'+esc(stage.answers[i])+'</button>').join('')+'</div>';
 app.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.deal)===stage.correct;d.score+=ok?3:-2;d.trust=Math.max(0,Math.min(100,d.trust+(ok?8:-18)));d.history.push({ok,why:stage.why});d.index++;if(d.index===dealStages.length)addRecord({type:'Полная сделка',score:d.score,trust:d.trust,success:d.trust>=60&&d.score>=12,turns:d.index});deal()});
}
function daily(){
 const a=loadRecords(),weak=a.filter(x=>!x.success).slice(-1)[0],suggest=weak&&weak.root?PhuketBranches.roots.find(x=>x.id===weak.root):null;
 app.innerHTML='<h2>Ежедневная тренировка · 10 минут</h2><p class="muted">Короткий план на каждый день. Прогресс сохраняется после завершения упражнений.</p><article><h3>1. Разминка · 3 минуты</h3><p>Ответьте на вопросы экзамена, чтобы освежить знания.</p><button id="daily-exam">Открыть экзамен</button></article><article><h3>2. Возражения · 4 минуты</h3><p>'+(suggest?'Рекомендуем повторить: '+esc(suggest.title):'Потренируйте разговор с требовательным покупателем.')+'</p><button id="daily-branch">Открыть переговоры</button></article><article><h3>3. Полная сделка · 3 минуты</h3><p>Пройдите цепочку из шести этапов и разберите ошибки.</p><button id="daily-deal">Открыть сделку</button></article>';
 document.getElementById('daily-exam').onclick=()=>tab('exam');document.getElementById('daily-deal').onclick=()=>tab('deal');document.getElementById('daily-branch').onclick=()=>{branchState=PhuketBranches.create(suggest?suggest.id:'skeptic','hard');saveBranch();tab('branches')};
}
function loadRecords(){try{return JSON.parse(localStorage.getItem('phuket-records-v7')||'[]').filter(x=>x&&typeof x==='object').slice(-100)}catch{return []}}
function addRecord(r){try{const a=loadRecords();a.push({...r,date:new Date().toISOString()});localStorage.setItem('phuket-records-v7',JSON.stringify(a.slice(-100)))}catch{}}
function recordTraining(s){const p=PhuketBranches.progress(s);addRecord({type:'Ветвления',score:p.score,trust:p.trust,success:s.node==='end_good',turns:p.turns,root:s.root})}
function exam(){
 if(!examState)examState={index:0,correct:0,order:PhuketAcademy.questions.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,20),answers:[]};
 const e=examState,q=PhuketAcademy.questions[e.order[e.index]];
 if(!q){app.innerHTML='<h2>Экзамен завершён</h2><article><h3>Результат: '+e.correct+' из '+e.order.length+'</h3><p>'+Math.round(e.correct/e.order.length*100)+'% правильных ответов</p><p>Ниже — темы для повторения:</p>'+e.answers.filter(x=>!x.ok).map(x=>'<p>'+esc(x.question)+' — '+esc(x.correct)+'</p>').join('')+'<button id="exam-again">Пройти ещё раз</button></article>';document.getElementById('exam-again').onclick=()=>{examState=null;exam()};return}
 app.innerHTML='<h2>Экзамен брокера</h2><p class="muted">20 вопросов без подсказок. Результат сохраняется на этом устройстве.</p><article><div class="category">Вопрос '+(e.index+1)+' из '+e.order.length+'</div><h3>'+esc(q[0])+'</h3>'+q[1].map((a,i)=>'<button class="exam-choice" data-exam="'+i+'">'+esc(a)+'</button>').join('')+'</article>';
 app.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{const selected=Number(b.dataset.exam),ok=selected===q[2];e.correct+=ok?1:0;e.answers.push({question:q[0],correct:q[1][q[2]],ok});e.index++;if(e.index===e.order.length)addRecord({type:'Экзамен',score:e.correct,success:e.correct>=16,turns:e.order.length});exam()});
}
function stats(){
 const a=loadRecords(),success=a.filter(x=>x.success).length,avg=a.length?Math.round(a.reduce((s,x)=>s+(x.type==='Экзамен'?x.score*5:Math.max(0,Math.min(100,x.trust||0))),0)/a.length):0;
 app.innerHTML='<h2>Мой прогресс</h2><p class="muted">Данные хранятся только в браузере на этом устройстве.</p><div class="panel"><h3>Завершено тренировок: '+a.length+'</h3><p>Успешных: '+success+' · Средний показатель: '+avg+'/100</p></div>'+(a.length?a.slice().reverse().map(x=>'<article><b>'+esc(x.type)+'</b><p>'+new Date(x.date).toLocaleDateString('ru-RU')+' · '+(x.type==='Экзамен'?x.score+'/20':(x.trust||0)+'/100 доверия')+' · '+(x.success?'Успех':'Требует повторения')+'</p></article>').join(''):'<p>Заверши переговоры или экзамен, чтобы увидеть результаты.</p>')+'<button id="clearstats">Очистить историю</button>';
 document.getElementById('clearstats').onclick=()=>{if(confirm('Удалить сохранённые результаты тренировок?')){localStorage.removeItem('phuket-records-v7');stats()}};
}
function calc(){
 app.innerHTML='<h2>Калькулятор инвестора</h2><p class="muted">Учебная модель. Все значения — твои предположения, не прогноз и не гарантия доходности.</p><div class="panel">'+
 [['price','Цена объекта (THB)',6000000],['closing','Оформление и дополнительные затраты (THB)',180000],['rent','Аренда в сутки (THB)',3000],['days','Занятых дней в году',180],['fee','Комиссия управления (%)',25],['cost','Прочие расходы в год (THB)',100000]].map(x=>'<label>'+x[1]+'<input class="calc-input" id="'+x[0]+'" type="number" min="0" step="any" value="'+x[2]+'"></label>').join('')+'<div id="calc-result" class="calc-result" aria-live="polite"></div></div>';
 function update(){const n=id=>Math.max(0,Number(document.getElementById(id).value)||0),investment=n('price')+n('closing'),days=Math.min(365,n('days')),fee=Math.min(100,n('fee')),gross=n('rent')*days,net=gross*(1-fee/100)-n('cost'),roi=investment?net/investment*100:0;const money=x=>Math.round(x).toLocaleString('ru-RU');document.getElementById('calc-result').innerHTML='<h3>Учебный расчёт</h3><p>Общие вложения: '+money(investment)+' THB</p><p>Валовая аренда: '+money(gross)+' THB/год</p><p>Чистый денежный поток: '+money(net)+' THB/год</p><p><b>Доходность на вложения: '+roi.toFixed(1)+'% годовых</b></p><p class="muted">Не учитывает изменение цены объекта, личные налоги, финансирование, курсы валют и непредвиденные расходы. Уточняйте местные правила и договор.</p>'}
 app.querySelectorAll('.calc-input').forEach(x=>x.oninput=update);update();
}
