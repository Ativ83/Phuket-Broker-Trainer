 app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{PhuketBranches.step(branchState,Number(b.dataset.choice));saveBranch();if(PhuketBranches.progress(branchState).complete)recordTraining(branchState);branches()});
 document.getElementById('branchhistory').onclick=()=>{document.getElementById('branchinfo').innerHTML='<h3>Ваш маршрут</h3>'+(s.history.length?s.history.map((h,i)=>'<p>'+(i+1)+'. '+esc(h.label)+' · '+(h.delta>0?'+':'')+h.delta+' балла · доверие '+h.trust+'/100<br>'+esc(PhuketBranches.advice(h.from,h.choice))+'</p>').join(''):'<p>Пока нет решений.</p>')};
 document.getElementById('branchmap').onclick=()=>{const seen=new Set();let queue=[s.root],rows=[];while(queue.length){const id=queue.shift();if(seen.has(id))continue;seen.add(id);const node=PhuketBranches.get(id);if(!node)continue;rows.push('<details><summary>'+esc(id)+' · '+node.choices.length+' вариантов</summary>'+node.choices.map(o=>'<p>'+esc(o[0])+' → '+esc(o[2])+'</p>').join('')+'</details>');queue.push(...node.choices.map(o=>o[2]))}document.getElementById('branchinfo').innerHTML='<h3>Карта вариантов ('+seen.size+' узлов)</h3>'+rows.join('')};
}


const dealStages=[
 {title:'Знакомство',client:'Я впервые рассматриваю Пхукет. Не знаю, подойдёт ли мне покупка.',answers:['Для чего рассматриваете недвижимость и кто будет ею пользоваться?','Сразу вносите депозит, иначе цена вырастет.','Все покупают, и вам надо.'],correct:0,why:'Сначала выясните цель покупки.'},
 {title:'Выявление потребностей',client:'Хочу жить зимой и иногда сдавать квартиру.',answers:['Давайте уточним сроки проживания, аренду, бюджет и желаемый район.','Тогда вам подойдёт абсолютно любой объект.','Не важно, какой бюджет.'],correct:0,why:'Нужно собрать критерии до подбора.'},
 {title:'Подбор объекта',client:'Мне предлагают две квартиры. Как выбрать?',answers:['Сравним расходы, расположение, юридические документы и вашу цель.','Выбирайте самую дорогую.','По фотографиям всё понятно.'],correct:0,why:'Подбор строится на критериях клиента.'},
 {title:'Возражение по цене',client:'Ваш вариант дороже предложения конкурента.',answers:['Давайте сравним условия, комплектацию и полную стоимость.','У конкурента точно мошенники.','Тогда разговор окончен.'],correct:0,why:'Сравнивайте проверяемые параметры без нападок.'},
 {title:'Проверка рисков',client:'А если застройщик задержит передачу квартиры?',answers:['Проверим договор, график, ответственность и независимую юридическую экспертизу.','Такого никогда не бывает.','Лучше не думать о рисках.'],correct:0,why:'Риски нужно назвать и проверить.'},
 {title:'Следующий шаг',client:'В целом интересно. Что дальше?',answers:['Подготовлю подборку и документы; выберем конкретное время обсудить их вместе?','Сначала отправьте депозит мне лично.','Я гарантирую прибыль и перепродажу.'],correct:0,why:'Фиксируйте прозрачный следующий шаг.'}
];
function deal(){
 if(!dealState)dealState={index:0,score:0,trust:50,history:[]};
 const d=dealState,stage=dealStages[d.index];
 if(!stage){const won=d.trust>=60&&d.score>=12;app.innerHTML='<h2>Экзамен на сделку завершён</h2><article><h3>'+(won?'Клиент готов к следующему шагу':'Клиент не готов продолжать')+'</h3><p>Баллы: '+d.score+' · Доверие: '+d.trust+'/100</p><h3>Разбор ответов</h3>'+d.history.map((h,i)=>'<div class="'+(h.ok?'review-good':'review-error')+'"><b>'+esc(dealStages[i].title)+'</b><p>'+esc(h.why)+'</p>'+(h.ok?'':'<p><b>Лучший ответ:</b> '+esc(dealStages[i].answers[0])+'</p>')+'</div>').join('')+'<button id="deal-restart">Новая сделка</button></article>';document.getElementById('deal-restart').onclick=()=>{dealState=null;deal()};return}
 const order=[1,2,0].map((x,i)=>(x+d.index)%3);
 app.innerHTML='<h2>Экзамен на полную сделку</h2><p class="muted">Шесть этапов: от знакомства до следующего шага. Ошибки снижают доверие.</p><div class="panel"><div class="category">Этап '+(d.index+1)+' из '+dealStages.length+' · '+esc(stage.title)+'</div><p>Доверие клиента: '+d.trust+'/100</p><div class="bubble client"><b>Клиент</b><p>'+esc(stage.client)+'</p></div>'+order.map(i=>'<button class="deal-choice" data-deal="'+i+'">'+esc(stage.answers[i])+'</button>').join('')+'</div>';
 app.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.deal)===stage.correct;d.score+=ok?3:-2;d.trust=Math.max(0,Math.min(100,d.trust+(ok?8:-18)));d.history.push({ok,why:stage.why});d.index++;if(d.index===dealStages.length)addRecord({type:'Полная сделка',score:d.score,trust:d.trust,success:d.trust>=60&&d.score>=12,turns:d.index});deal()});
}
function daily(){
 const a=loadRecords(),weak=a.filter(x=>!x.success).slice(-1)[0],suggest=weak&&weak.root?PhuketBranches.roots.find(x=>x.id===weak.root):null;
 app.innerHTML='<h2>Ежедневная тренировка · 10 минут</h2><p class="muted">Короткий план на каждый день. Прогресс сохраняется после завершения упражнений.</p><article><h3>1. Разминка · 3 минуты</h3><p>Ответьте на вопросы экзамена, чтобы освежить знания.</p><button id="daily-exam">Открыть экзамен</button></article><article><h3>2. Возражения · 4 минуты</h3><p>'+(suggest?'Рекомендуем повторить: '+esc(suggest.title):'Потренируйте разговор с требовательным покупателем.')+'</p><button id="daily-branch">Открыть переговоры</button></article><article><h3>3. Полная сделка · 3 минуты</h3><p>Пройдите цепочку из шести этапов и разберите ошибки.</p><button id="daily-deal">Открыть сделку</button></article>';
 document.getElementById('daily-exam').onclick=()=>tab('exam');document.getElementById('daily-deal').onclick=()=>tab('deal');document.getElementById('daily-branch').onclick=()=>{branchState=PhuketBranches.create(suggest?suggest.id:'skeptic','hard');saveBranch();tab('branches')};
}
function loadRecords(){try{return JSON.parse(localStorage.getItem('phuket-records-v7')||'[]').filter(x=>x&&typeof x==='object').slice(-100)}catch{return []}}
function addRecord(r){try{const a=loadRecords();a.push({...r,date:new Date().toISOString()});localStorage.setItem('phuket-records-v7',JSON.stringify(a.slice(-100)))}catch{}}
function recordTraining(s){const p=PhuketBranches.progress(s);addRecord({type:'Ветвления',score:p.score,trust:p.trust,success:s.node==='end_good',turns:p.turns,root:s.root})}
function exam(){
 if(!examState)examState={index:0,correct:0,order:PhuketAcademy.questions.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,20),answers:[]};
 const e=examState,q=PhuketAcademy.questions[e.order[e.index]];
 if(!q){app.innerHTML='<h2>Экзамен завершён</h2><article><h3>Результат: '+e.correct+' из '+e.order.length+'</h3><p>'+Math.round(e.correct/e.order.length*100)+'% правильных ответов</p><p>Ниже — темы для повторения:</p>'+e.answers.filter(x=>!x.ok).map(x=>'<p>'+esc(x.question)+' — '+esc(x.correct)+'</p>').join('')+'<button id="exam-again">Пройти ещё раз</button></article>';document.getElementById('exam-again').onclick=()=>{examState=null;exam()};return}
 app.innerHTML='<h2>Экзамен брокера</h2><p class="muted">20 вопросов без подсказок. Результат сохраняется на этом устройстве.</p><article><div class="category">Вопрос '+(e.index+1)+' из '+e.order.length+'</div><h3>'+esc(q[0])+'</h3>'+q[1].map((a,i)=>'<button class="exam-choice" data-exam="'+i+'">'+esc(a)+'</button>').join('')+'</article>';
 app.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{const selected=Number(b.dataset.exam),ok=selected===q[2];e.correct+=ok?1:0;e.answers.push({question:q[0],correct:q[1][q[2]],ok});e.index++;if(e.index===e.order.length)addRecord({type:'Экзамен',score:e.correct,success:e.correct>=16,turns:e.order.length});exam()});
}
function stats(){
 const a=loadRecords(),success=a.filter(x=>x.success).length,avg=a.length?Math.round(a.reduce((s,x)=>s+(x.type==='Экзамен'?x.score*5:Math.max(0,Math.min(100,x.trust||0))),0)/a.length):0;
 app.innerHTML='<h2>Мой прогресс</h2><p class="muted">Данные хранятся только в браузере на этом устройстве.</p><div class="panel"><h3>Завершено тренировок: '+a.length+'</h3><p>Успешных: '+success+' · Средний показатель: '+avg+'/100</p></div>'+(a.length?a.slice().reverse().map(x=>'<article><b>'+esc(x.type)+'</b><p>'+new Date(x.date).toLocaleDateString('ru-RU')+' · '+(x.type==='Экзамен'?x.score+'/20':(x.trust||0)+'/100 доверия')+' · '+(x.success?'Успех':'Требует повторения')+'</p></article>').join(''):'<p>Заверши переговоры или экзамен, чтобы увидеть результаты.</p>')+'<button id="clearstats">Очистить историю</button>';
 document.getElementById('clearstats').onclick=()=>{if(confirm('Удалить сохранённые результаты тренировок?')){localStorage.removeItem('phuket-records-v7');stats()}};
}
function calc(){
 app.innerHTML='<h2>Калькулятор инвестора</h2><p class="muted">Учебная модель. Все значения — твои предположения, не прогноз и не гарантия доходности.</p><div class="panel">'+
 [['price','Цена объекта (THB)',6000000],['closing','Оформление и дополнительные затраты (THB)',180000],['rent','Аренда в сутки (THB)',3000],['days','Занятых дней в году',180],['fee','Комиссия управления (%)',25],['cost','Прочие расходы в год (THB)',100000]].map(x=>'<label>'+x[1]+'<input class="calc-input" id="'+x[0]+'" type="number" min="0" step="any" value="'+x[2]+'"></label>').join('')+'<div id="calc-result" class="calc-result" aria-live="polite"></div></div>';
 function update(){const n=id=>Math.max(0,Number(document.getElementById(id).value)||0),investment=n('price')+n('closing'),days=Math.min(365,n('days')),fee=Math.min(100,n('fee')),gross=n('rent')*days,net=gross*(1-fee/100)-n('cost'),roi=investment?net/investment*100:0;const money=x=>Math.round(x).toLocaleString('ru-RU');document.getElementById('calc-result').innerHTML='<h3>Учебный расчёт</h3><p>Общие вложения: '+money(investment)+' THB</p><p>Валовая аренда: '+money(gross)+' THB/год</p><p>Чистый денежный поток: '+money(net)+' THB/год</p><p><b>Доходность на вложения: '+roi.toFixed(1)+'% годовых</b></p><p class="muted">Не учитывает изменение цены объекта, личные налоги, финансирование, курсы валют и непредвиденные расходы. Уточняйте местные правила и договор.</p>'}
 app.querySelectorAll('.calc-input').forEach(x=>x.oninput=update);update();
}

for(const t of ['scripts','dialog','branches','deal','daily','exam','stats','calc','notes','knowledge','smm','themes'])document.getElementById('tab-'+t).onclick=()=>tab(t);document.getElementById('theme-shortcut').onclick=()=>tab('themes');PhuketThemes.applySaved();tab('scripts');
