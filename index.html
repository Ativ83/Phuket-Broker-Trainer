<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151c28"><title>Phuket Broker Trainer</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111720;color:#f3efe7;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:35px 20px 22px;background:linear-gradient(130deg,#202c3d,#111720);border-bottom:1px solid #4d453b}header small{color:#e3bd79;letter-spacing:.18em}h1{font-size:29px;margin:10px 0}h2{font-size:22px}h3{font-size:18px}p{line-height:1.6}.muted{color:#b4b7bd}.shell{max-width:850px;margin:auto;padding:20px 16px 110px}nav{display:flex;gap:7px;margin-bottom:20px}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #6b6258;color:#f6ead8;background:#252b37;padding:12px 15px;border-radius:12px}button.active,.primary{background:#d7b77a;color:#1b1c22;border-color:#d7b77a;font-weight:700}nav button{flex:1;padding:12px 5px;font-size:14px}article,.panel{padding:18px;margin:12px 0;background:#202734;border:1px solid #424550;border-radius:18px}article h3{margin:8px 0}.category{color:#d7b77a;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.bubble{padding:13px 15px;border-radius:14px;background:#343b49;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.me{background:#514533;margin-left:18px}.bubble.client{margin-right:18px}.chat{max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}textarea{width:100%;min-height:90px;background:#161d29;color:#fff;border:1px solid #5b606a;border-radius:12px;padding:12px;resize:vertical}select{width:100%;background:#161d29;color:#fff;border:1px solid #5b606a;padding:12px;border-radius:12px;margin:8px 0 12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.actions button{flex:1 1 130px}.small{font-size:13px;color:#c3c3c8}li{margin:8px 0}footer{text-align:center;color:#a9aab0;padding:30px 15px;font-size:12px}details{margin:10px 0;padding:10px;border:1px solid #444;border-radius:10px}summary{cursor:pointer}[hidden]{display:none!important}
</style></head><body><header><small>PHUKET · REAL ESTATE</small><h1>Phuket Broker Trainer</h1><p>Продажи недвижимости на Пхукете · русскоязычные покупатели</p></header><main class="shell"><nav><button id="tab-scripts" class="active">Сценарии</button><button id="tab-dialog">Диалог</button><button id="tab-notes">Памятка</button></nav><section id="app"></section></main><footer>Учебный тренажёр. Инвестиционные и юридические сведения требуют независимой проверки.</footer><script src="./phuket-v2.js"></script><script>
const scenarios=[["Первый контакт","Вы оставляли заявку по недвижимости на Пхукете. Удобно две минуты уточнить вашу задачу, чтобы подобрать подходящие варианты?","Для чего рассматриваете покупку — жить, отдыхать или инвестировать?","Если неудобно, когда лучше связаться?"],["Выявление цели","Чтобы сравнить объекты по подходящим критериям, расскажите, какого результата вы ждёте от покупки.","Как часто планируете приезжать? Рассматриваете сдачу в аренду?","Зафиксировать главную цель и критерии"],["Бюджет и расходы","Давайте определим комфортный бюджет с учётом не только цены, но и оформления и содержания.","В какой валюте удобнее сравнивать? Есть ли резерв на дополнительные расходы?","Согласовать диапазон полной стоимости"],["Банг Тао или Раваи","Эти районы отличаются инфраструктурой и образом жизни. Сравним их под вашу задачу, а не по общему рейтингу.","Что важнее: пляж, школы, кафе, спокойствие или аренда?","Предложить сравнительную подборку"],["Инвестиционный покупатель","Для инвестиции важно считать не рекламную доходность, а денежный поток после расходов и простоев.","Какой срок владения? Насколько важна ликвидность?","Подготовить несколько сценариев расчёта"],["Покупка для семьи","Для семейной покупки начнём с повседневной логистики, школ, медицины и удобства района.","Сколько человек будет жить? Нужна ли школа?","Составить список районов и объектов"],["Возражение: дорого","Понимаю. Давайте сравним не только стоимость квадратного метра, но и характеристики и полные расходы.","С какими объектами сравниваете? Что для вас принципиально?","Показать альтернативы и компромиссы"],["Опасение: застройщик","Проверка застройщика и документов — разумный этап до принятия решения.","Какие риски волнуют больше всего: сроки, качество или документы?","Согласовать независимую юридическую проверку"],["Обещают 12% доходности","Высокие проценты требуют проверки методики расчёта, расходов и условий договора.","Это прогноз или договорное обязательство? Учтены простои и налоги?","Запросить подтверждающие документы"],["Форма владения","Для иностранного покупателя форма владения зависит от типа недвижимости и условий проекта.","Рассматриваете кондоминиум или виллу?","Направить условия независимому юристу"],["Отправьте в WhatsApp","Конечно, отправлю. Чтобы не перегружать вариантами, уточню один критерий.","Что важнее: район, бюджет или назначение покупки?","Согласовать подборку и срок обратной связи"],["Назначение презентации","Предлагаю коротко сравнить 2–3 подходящих варианта с плюсами, ограничениями и расходами.","Удобнее видеозвонок или письменная подборка?","Назначить конкретный следующий контакт"]] .concat(PhuketV2.extra);const app=document.querySelector('#app');let persona='investor',turns=[],facts={},rec=null;let buyer=PhuketV2.create(persona);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stop(){try{rec?.abort()}catch{}rec=null;try{speechSynthesis.cancel()}catch{}}
function speak(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.92;speechSynthesis.speak(u)}catch{}}
function tab(t){stop();for(const k of ['scripts','dialog','notes'])document.getElementById('tab-'+k).classList.toggle('active',k===t);if(t==='scripts')list();if(t==='dialog')dialog();if(t==='notes')notes()}
function list(){app.innerHTML='<h2>Сценарии Пхукета</h2><p class="muted">40 консультационных скриптов. Выберите тему.</p>'+scenarios.map((s,i)=>'<article><div class="category">Сценарий '+(i+1)+'</div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p><button data-i="'+i+'">Открыть</button></article>').join('');app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>detail(+b.dataset.i))}
function detail(i){const s=scenarios[i];app.innerHTML='<button id="back">← Все сценарии</button><article><div class="category">Сценарий '+(i+1)+'</div><h2>'+esc(s[0])+'</h2><h3>Рекомендуемая формулировка</h3><div class="bubble">'+esc(s[1])+'</div><button id="listen">Прослушать</button><h3>Уточняющий вопрос</h3><div class="bubble">'+esc(s[2])+'</div><h3>Следующий шаг</h3><p>'+esc(s[3])+'</p><button id="practice" class="primary">Отработать с клиентом</button></article>';document.getElementById('back').onclick=list;document.getElementById('listen').onclick=()=>speak(s[1]);document.getElementById('practice').onclick=()=>{turns=[];facts={};buyer=PhuketV2.create(persona);tab('dialog')}}
const topics=[['goal',/для чего|цель|инвестиц|сдава|прожива|отдых/,'Скорее для инвестиций, но иногда будем приезжать сами.'],['budget',/бюджет|сумм|ценов|сколько.*(готов|рассчитыва)/,'Рассматриваю примерно 10–12 миллионов рублей, но хочу понимать все расходы.'],['area',/район|локац|пляж|инфраструктур|банг тао|раваи/,'Пока выбираю между Банг Тао и Раваи. В чём разница для инвестора?'],['term',/срок|когда.*(покуп|решен)|как скоро/,'Могу принять решение в ближайшие месяцы, если найду понятный вариант.'],['risk',/риск|опасен|беспоко|смуща|сомнен|довер/,'Беспокоят документы и слишком оптимистичные обещания доходности.']];
const objections=[[/доходност|процент|гарант/,'Как рассчитана доходность? Учтены налоги, управление и простои?'],[/дешев|скидк|цен/,'А какие дополнительные расходы есть помимо цены объекта?'],[/застройщ|документ|юрист/,'Можно ли до оплаты провести независимую проверку документов?'],[/срочно|последн.*(квартир|вариант)/,'Не хочу принимать решение под давлением. Лучше сначала сравним условия.']];
const fallbacks={investor:['Можете привести конкретные цифры и их источники?','А какие риски вы видите у этого объекта?','Что ещё можно сравнить в моём бюджете?','Каким будет следующий шаг для проверки предложения?'],family:['Насколько удобно там жить с семьёй?','А что с инфраструктурой и транспортом?','Какие минусы у этого варианта?','Можно посмотреть альтернативы?']};
function reply(t){const response=PhuketV2.respond(buyer,t);facts=buyer.facts;return response}
const opening=()=>PhuketV2.templates[persona].opening;const last=()=>turns.at(-1)?.client||opening();
function draw(announce){const box=document.getElementById('chat');if(!box)return;box.innerHTML='<div class="bubble client"><b>Клиент</b><p>'+esc(opening())+'</p></div>'+turns.map(t=>'<div class="bubble me"><b>Вы</b><p>'+esc(t.broker)+'</p></div><div class="bubble client"><b>Клиент</b><p>'+esc(t.client)+'</p></div>').join('');box.scrollTop=box.scrollHeight;if(announce&&document.getElementById('auto').checked)speak(last())}
function dialog(){app.innerHTML='<h2>Голосовой диалог · бесплатно</h2><p class="small">Клиент отвечает по правилам, а не с помощью нейросети. Вопросы распознаются по ключевым словам; ответы могут повторяться.</p><div class="panel"><label>Характер покупателя<select id="persona"><option value="investor">Требовательный инвестор</option><option value="family">Осторожный семейный покупатель</option><option value="skeptic">Недоверчивый покупатель</option></select></label><div class="actions"><button id="restart">Новый звонок</button><button id="report">Разбор</button></div><div id="chat" class="chat"></div><textarea id="input" maxlength="3000" placeholder="Напишите или продиктуйте ответ брокера"></textarea><div class="actions"><button id="mic">Говорить</button><button id="send" class="primary">Ответить</button><button id="repeat">Озвучить клиента</button></div><label class="small"><input type="checkbox" id="auto" checked> Автоматически озвучивать ответы</label><p id="status" class="small" role="status"></p><div id="reportbody"></div></div>';document.getElementById('persona').value=persona;document.getElementById('persona').onchange=e=>{persona=e.target.value;turns=[];facts={};buyer=PhuketV2.create(persona);draw(true)};document.getElementById('restart').onclick=()=>{turns=[];facts={};buyer=PhuketV2.create(persona);draw(true)};document.getElementById('report').onclick=report;document.getElementById('send').onclick=send;document.getElementById('repeat').onclick=()=>speak(last());document.getElementById('mic').onclick=listen;draw(false)}
function send(){const input=document.getElementById('input'),text=input.value.trim();if(!text){document.getElementById('status').textContent='Сначала введите ответ.';return}const client=reply(text);turns.push({broker:text,client});input.value='';document.getElementById('status').textContent='';draw(true)}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('status').textContent='Распознавание недоступно. Используйте диктовку клавиатуры iPhone.';return}stop();try{const r=new R();rec=r;r.lang='ru-RU';r.continuous=false;r.interimResults=false;r.onresult=e=>{if(rec!==r)return;document.getElementById('input').value=Array.from(e.results).map(x=>x[0].transcript).join(' ');document.getElementById('status').textContent='Речь распознана. Проверьте текст и нажмите «Ответить».'};r.onerror=e=>document.getElementById('status').textContent='Ошибка распознавания: '+e.error;r.onend=()=>{if(rec===r)rec=null};r.start();document.getElementById('status').textContent='Слушаю…'}catch(e){document.getElementById('status').textContent='Микрофон недоступен: '+e.message}}
function report(){const names={goal:'Цель',budget:'Бюджет',area:'Район',term:'Сроки',risk:'Опасения'};document.getElementById('reportbody').innerHTML='<article><h3>Разбор</h3><p>Реплик брокера: '+turns.length+'. Затронуто тем: '+Object.keys(facts).length+' из 5.</p><p>'+esc(Object.keys(facts).map(k=>names[k]).join(', ')||'Пока нет')+'</p><p class="small">Оценка отражает только совпадение ключевых слов, а не качество продажи.</p></article>'}
function notes(){app.innerHTML='<article><h2>Памятка брокера</h2><ul><li>Сначала уточняйте цель, бюджет, сроки и отношение к рискам.</li><li>Сравнивайте районы под конкретный образ жизни покупателя.</li><li>Показывайте полную стоимость владения, управление, налоги и возможные простои.</li><li>Не обещайте гарантированную доходность без документального основания.</li><li>Правила владения кондоминиумом и землёй иностранцами различаются.</li><li>Документы и договор должен проверять независимый специалист в Таиланде.</li><li>Не давите на клиента; согласовывайте следующий шаг.</li></ul></article>'}
for(const t of ['scripts','dialog','notes'])document.getElementById('tab-'+t).onclick=()=>tab(t);tab('scripts');
</script></body></html>
